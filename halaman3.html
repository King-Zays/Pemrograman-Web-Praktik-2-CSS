<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>title</title>
<style>
/* Universal selector */
* {
  box-shadow: #585858 3px 3px 4px;
}

/* HTML selector */
body {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10px;
  font-weight: normal;
  background-color: #6699CC;
}

p{
  color: green;
  background-color: white;
}

/* Class selector */
.paragraf2 {
  color: red;
  background-color: white;
}
.paragraf3 {
  color: blue;
  background-color: white;
}

/* HTML selector */
h1 {
  color: #D91C1F;
}
</style>
</head>
<body>
<h1>Belajar Mengenal Selector</h1>
<hr>
<p>Paragraf Pertama</p>
<p class="paragraf2">Paragraf Kedua</p>
<p class="paragraf3">Paragraf Ketiga</p>
</body>
</html>
